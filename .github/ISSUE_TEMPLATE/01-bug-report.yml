name: Bug Report
description: Something is broken, wrong, or crashing.
title: "[Bug]: "
type: bug
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem with Codex Minibar.

        Please do **not** paste API keys, tokens, credentials, or raw usage history.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A short description of the bug.
      placeholder: The tray ring stays at 0% after Codex usage resets.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps another person can follow.
      placeholder: |
        1. Enable Codex in Settings → Providers.
        2. Open the tray popup.
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: The 5h usage should drop back after a reset.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: The popup still shows the previous window until I restart the app.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Codex Minibar version
      description: Shown in Settings → About & Updates.
      placeholder: "0.4.9"
    validations:
      required: true

  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - x64
        - ARM64
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Install type
      options:
        - Installer
        - Portable zip
        - Built from source
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      multiple: true
      options:
        - Tray icon
        - Popup
        - Settings
        - Notifications
        - Auto-start / activation
        - Updater
        - Stream Deck
        - Provider auth / quota
        - Other
    validations:
      required: true

  - type: dropdown
    id: providers
    attributes:
      label: Affected providers
      description: Select every provider involved. Skip this if the bug is not provider-specific.
      multiple: true
      options:
        - Codex
        - Claude
        - Cursor
        - OpenCode Zen
        - OpenCode Go
        - OpenRouter
        - Antigravity
        - Grok
        - None / not provider-specific

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Open Settings → Log → Open log.txt and paste the relevant lines.
        Redact tokens, keys, and personal paths if needed.
      render: text

  - type: textarea
    id: extras
    attributes:
      label: Screenshots or extra context
      description: Drag screenshots here. Add anything else that helps, such as install path or Codex/CLI setup.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This report does not include secrets, tokens, or personal usage dumps.
          required: true
