name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, and test
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # Large git dep (windows-rs); CLI fetch is less likely to sit silent for minutes.
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Previous runs failed and skipped cache, so every CI recloned windows-rs.
          cache-on-failure: true
      - name: Check formatting
        # Skip path crates `.vendor` and `.vendor-setup`. `--all` formats local path deps.
        run: cargo fmt --package codex-minibar --check
      - name: Fetch dependencies
        run: cargo fetch --locked
      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features --locked

