name: Command Palette extension

# The app installs the extension from data/ on main (see src/surfaces/cmdpal.rs), so
# packages are rebuilt and committed whenever the manifest version changes.
on:
  push:
    branches: [main]
    paths:
      - "cmdpal/**"
      - "data/CodexMinibar.CommandPalette_*.msix"
      - ".github/workflows/cmdpal.yml"
  workflow_dispatch:
    inputs:
      force:
        description: Repack even if the packaged version already matches
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cmdpal-extension
  cancel-in-progress: false

jobs:
  pack:
    name: Pack extension into data/
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Compare extension versions
        id: check
        shell: pwsh
        env:
          FORCE: ${{ inputs.force }}
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [xml]$manifest = Get-Content -Raw "cmdpal/CodexMinibar.CommandPalette/Package.appxmanifest"
          $version = $manifest.Package.Identity.Version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Source extension version: $version"
          $changed = $env:FORCE -eq "true"
          foreach ($arch in "x64", "arm64") {
            $packed = "data/CodexMinibar.CommandPalette_$arch.msix"
            $packedVersion = ""
            if (Test-Path -LiteralPath $packed) {
              $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $packed))
              try {
                $reader = [System.IO.StreamReader]::new($zip.GetEntry("AppxManifest.xml").Open())
                [xml]$packedManifest = $reader.ReadToEnd()
                $reader.Dispose()
                $packedVersion = $packedManifest.Package.Identity.Version
              } finally {
                $zip.Dispose()
              }
            }
            Write-Host "Packaged $arch version: $(if ($packedVersion) { $packedVersion } else { '<missing>' })"
            if ($packedVersion -ne $version) {
              $changed = $true
            }
          }
          "changed=$($changed.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: actions/setup-dotnet@v4
        if: steps.check.outputs.changed == 'true'
        with:
          dotnet-version: 10.0.x

      - name: Build MSIX packages
        if: steps.check.outputs.changed == 'true'
        shell: pwsh
        working-directory: cmdpal/CodexMinibar.CommandPalette
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($platform in "x64", "ARM64") {
            dotnet build -c Release -p:Platform=$platform -p:GenerateAppxPackageOnBuild=true -nologo
            if ($LASTEXITCODE -ne 0) {
              throw "dotnet build failed for $platform with exit code $LASTEXITCODE"
            }
          }

      - name: Stage packages in data/
        if: steps.check.outputs.changed == 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($arch in "x64", "arm64") {
            $built = Get-ChildItem -Path cmdpal/dist -Recurse -Filter "CodexMinibar.CommandPalette_$($env:VERSION)_$arch.msix" |
              Select-Object -First 1
            if (-not $built) {
              throw "MSIX for $arch was not created under cmdpal/dist"
            }
            Copy-Item -LiteralPath $built.FullName -Destination "data/CodexMinibar.CommandPalette_$arch.msix" -Force
            Write-Host "Staged $($built.Name)"
          }

      - name: Commit packaged extension
        if: steps.check.outputs.changed == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/CodexMinibar.CommandPalette_*.msix
          if git diff --cached --quiet -- data; then
            echo "Packaged extension is already committed"
            exit 0
          fi
          git commit -m "pack command palette extension ${VERSION}"
          git push
