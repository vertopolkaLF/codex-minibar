name: Deploy GitHub Pages redirect

on:
  push:
    branches: [main]
    paths:
      - ".github/pages-redirect.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # The website now lives at https://vertopolkalf.ru/codex-minibar/ (lf-website repo).
      # Pages only serves a redirect there; 404.html catches old deep links.
      - name: Assemble redirect
        run: |
          mkdir -p _site
          cp .github/pages-redirect.html _site/index.html
          cp .github/pages-redirect.html _site/404.html
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
