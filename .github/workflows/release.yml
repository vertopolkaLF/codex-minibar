name: Release

on:
  workflow_dispatch:
    inputs:
      whats_new:
        description: Require a "What's new" summary (data/releases/<version>/whats-new.en.md)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -LiteralPath Cargo.toml -Pattern '^\s*version\s*=\s*"([^"]+)"' |
            Select-Object -First 1
          if (-not $match) {
            throw "Could not read package version from Cargo.toml"
          }
          $version = $match.Matches[0].Groups[1].Value
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Git tag '$($env:GITHUB_REF_NAME)' does not match Cargo.toml version '$tag'."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "version $version"

      # The app fetches this summary from main after updating; releasing
      # without one must be a deliberate choice.
      - name: Check release summary
        if: ${{ inputs.whats_new }}
        shell: pwsh
        run: |
          $summary = "data/releases/${{ steps.version.outputs.version }}/whats-new.en.md"
          if (-not (Test-Path -LiteralPath $summary)) {
            throw "Missing $summary. Write the release summary (see data/releases/README.md) or run with whats_new unchecked."
          }

  build:
    name: Build ${{ matrix.arch }}
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      # A release needs every architecture, so stop the others on first failure.
      fail-fast: true
      matrix:
        include:
          - arch: x86
            target: i686-pc-windows-msvc
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          # Per-arch caches; jobs run in parallel and build disjoint targets.
          key: ${{ matrix.arch }}
          cache-on-failure: true

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Build portable zip and NSIS installer
        shell: pwsh
        run: .\build.ps1 -Arch ${{ matrix.arch }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.arch }}
          path: dist/${{ needs.version.outputs.version }}/*
          if-no-files-found: error

  linux:
    name: Build Linux x64
    needs: version
    # The oldest supported runner keeps the glibc requirement low.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xkb-dev \
            libvulkan-dev libfontconfig-dev libfreetype-dev libdbus-1-dev \
            libssl-dev libzstd-dev patchelf rpm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-x64
          cache-on-failure: true

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Build tarball, .deb, .rpm and AppImage
        run: ./build-linux.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-linux-x64
          path: dist/${{ needs.version.outputs.version }}/*
          if-no-files-found: error

  streamdeck:
    name: Pack Stream Deck plugin
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: streamdeck/package-lock.json

      - name: Install Stream Deck build dependencies
        working-directory: streamdeck
        run: npm ci

      - name: Validate and pack Stream Deck plugin
        working-directory: streamdeck
        run: |
          npx streamdeck validate .\com.vertopolkalf.codex-minibar.sdPlugin
          npm run pack

      - name: Stage Stream Deck release asset
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pluginManifest = Get-Content -Raw "streamdeck/com.vertopolkalf.codex-minibar.sdPlugin/manifest.json" | ConvertFrom-Json
          $pluginPackage = "data/com.vertopolkalf.codex-minibar.streamDeckPlugin"
          if (-not (Test-Path -LiteralPath $pluginPackage -PathType Leaf)) {
            throw "Stream Deck package was not created at $pluginPackage"
          }
          $assetDirectory = "streamdeck-asset"
          New-Item -ItemType Directory -Path $assetDirectory -Force | Out-Null
          $assetName = "codex-minibar-streamdeck-$($pluginManifest.Version).streamDeckPlugin"
          Copy-Item -LiteralPath $pluginPackage -Destination (Join-Path $assetDirectory $assetName)
          Write-Host "Staged $assetName"

      - name: Upload Stream Deck artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-streamdeck
          path: streamdeck-asset/*
          if-no-files-found: error

  release:
    name: Draft GitHub release
    needs: [version, build, linux, streamdeck]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: build-*
          merge-multiple: true
          path: dist/${{ needs.version.outputs.version }}

      - name: Upload combined artifact
        uses: actions/upload-artifact@v7
        with:
          name: codex-minibar-${{ needs.version.outputs.version }}
          path: dist/${{ needs.version.outputs.version }}/*
          if-no-files-found: error

      - name: Create draft GitHub release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $version = $env:VERSION
          $tag = "v$version"
          $assetDir = Join-Path "dist" $version
          $assets = @(Get-ChildItem -LiteralPath $assetDir -File | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) {
            throw "No release assets found in $assetDir"
          }
          Write-Host "Assets:"
          $assets | ForEach-Object { Write-Host "  $_" }

          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing) {
            $release = $existing | ConvertFrom-Json
            if (-not $release.isDraft) {
              throw "Release $tag already exists and is published. Refusing to overwrite."
            }
            Write-Host "Updating draft $tag"
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "gh release upload failed with exit code $LASTEXITCODE"
            }
          } else {
            Write-Host "Creating draft $tag"
            gh release create $tag @assets --draft --title "Codex Minibar $version" --generate-notes --target $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) {
              throw "gh release create failed with exit code $LASTEXITCODE"
            }
          }
