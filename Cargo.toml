[package]
name = "codex-minibar"
version = "0.7.0"
edition = "2024"
description = "Windows tray companion for monitoring AI tools usage"
license = "Apache-2.0"
repository = "https://github.com/vertopolkaLF/codex-minibar"
homepage = "https://github.com/vertopolkaLF/codex-minibar"
readme = "README.md"
keywords = ["codex", "windows", "tray", "usage", "winui"]
categories = ["command-line-utilities", "gui"]

[dependencies]
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
directories = "6"
font8x8 = "0.3"
fontdue = "0.9"
png = "0.17"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
tempfile = "3"
ureq = { version = "2", default-features = false, features = ["tls", "native-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
zip = "2"
# Pin to the last hooks-era windows-rs commit. Tag 74 rewrites windows-reactor
# to the Component/View API and ships windows-core 0.100; both would require
# rewriting the UI and regenerating `.vendor`.
windows-collections = { git = "https://github.com/microsoft/windows-rs", rev = "07f344c019b8fdae4d398d4c2591596044cb416a", features = ["std"] }
windows-core = { git = "https://github.com/microsoft/windows-rs", rev = "07f344c019b8fdae4d398d4c2591596044cb416a" }
windows-reactor = { path = ".vendor" }
gpui = { version = "0.2.2", default-features = false }
futures = "0.3"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows-numerics = { git = "https://github.com/microsoft/windows-rs", rev = "07f344c019b8fdae4d398d4c2591596044cb416a" }
tray-icon = { version = "0.24", default-features = false }
windows = { git = "https://github.com/microsoft/windows-rs", rev = "07f344c019b8fdae4d398d4c2591596044cb416a", default-features = false, features = [
    "Data_Xml_Dom",
    "Foundation",
    "Graphics_Effects",
    "System",
    "UI_Composition",
    "UI_Composition_Desktop",
    "UI_Notifications",
    "UI_ViewManagement",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
    "Win32_System_WinRT_Graphics_Direct2D",
] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_System_DataExchange", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
windows-reactor-setup = { path = ".vendor-setup" }
winresource = "0.1"

[lints.clippy]
# WinUI builders thread many callbacks and snapshot fields; packing them into
# structs would be a rewrite, not a lint fix.
too_many_arguments = "allow"

[profile.release]
lto = "thin"
strip = true
panic = "abort"

# GPUI rebuilds and lays out the popup during animation. Keep application
# code debuggable while optimizing the renderer and its hot dependencies
# for the normal `cargo run` / `cargo watch -x run` development workflow.
[profile.dev.package]
gpui = { opt-level = 3 }
taffy = { opt-level = 3 }
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
